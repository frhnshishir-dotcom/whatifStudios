# Unit tests for tools/pipeline. No Blender, no GPU, no LFS download (the .blend/.mp4 files are not needed).
# Runs only when pipeline code, tests or configs change, to keep Actions minutes low.
name: pipeline tests

on:
  push:
    paths: ["tools/pipeline/**", "tests/**", "configs/**", "requirements-dev.txt", ".github/workflows/pipeline-tests.yml"]
  pull_request:
    paths: ["tools/pipeline/**", "tests/**", "configs/**", "requirements-dev.txt", ".github/workflows/pipeline-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-22.04, python: "3.9" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -r requirements-dev.txt
      - run: ffmpeg -hide_banner -version
      - run: python -m pytest -q
